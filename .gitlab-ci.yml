stages:
  - install_deps
  - test
  - build
  - package

default:
  image: hub.nexdev.net/base/node:lts ###node:lts
  before_script:
    - yarn install

Install Dependencies:
  stage: install_deps
  tags:
    - minio
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
    policy: pull-push
  script:
    - yarn install

Test:
  stage: test
  tags:
    - minio
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
    policy: pull
  script:
    - yarn test

Build:
  stage: build
  tags:
    - minio
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
    policy: pull
  script:
    - yarn build
  artifacts:
    paths:
      - public

Docker Build:
  before_script:
    # to skip default before_script###############
    - docker info
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL

  stage: package
  image: hub.nexdev.net/base/docker:20.10.7-bash #docker:stable
  tags:
    - minio
  #services:
  #  - docker:dind
  script:
    - docker build -t ${DOCKER_REG_LOCAL_URL}/gprg:latest .
    - docker push ${DOCKER_REG_LOCAL_URL}/gprg:latest