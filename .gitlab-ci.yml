stages:
  - install_deps
  - test
  - build
  - package

default:
  image: hub.nexdev.net/base/node:18.1-slim #node:lts
  before_script:
    - yarn install

Install Dependencies:
  stage: install_deps
  tags:
    - minio
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
  script:
    - yarn install

Test:
  stage: test
  tags:
    - minio
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
  script:
    - yarn test

Build:
  stage: build
  tags:
    - minio
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
  script:
    - yarn build
  artifacts:
    paths:
      - public

Docker Build:
  before_script:
    # to skip default before_script#######
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  stage: package
  image: hub.nexdev.net/base/docker:20.10.7-bash #docker:stable
  tags:
    - minio
  services:
    - docker:dind
  script:
    - docker build -t ${CI_REGISTRY_IMAGE}/gprg:latest .
    - docker push ${CI_REGISTRY_IMAGE}/gprg:latest